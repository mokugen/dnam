[workspace]
resolver = "3"
members = ["packages/kernels", "packages/vm", "packages/engine", "packages/train", "packages/capture", "packages/fixtures", "packages/js", "packages/studio"]
default-members = ["packages/kernels", "packages/vm", "packages/engine", "packages/train", "packages/capture", "packages/fixtures", "packages/studio"]
exclude = ["tools/sona-shaders"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "LicenseRef-DNAM-1.0.0"
repository = "https://github.com/dnam-project/dnam"

[workspace.dependencies]
dnam-kernels = { path = "packages/kernels", default-features = false }
dnam-vm = { path = "packages/vm", default-features = false }
dnam-engine = { path = "packages/engine", default-features = true }
dnam-train = { path = "packages/train", default-features = false }
dnam-capture = { path = "packages/capture", default-features = false }
dnam-fixtures = { path = "packages/fixtures" }
postcard = { version = "1", default-features = false, features = ["alloc"] }
wgpu = "30.0.2"
pollster = "0.4"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
cpal = "0.18"
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc", "zeroize"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc", "derive"] }
zerocopy = { version = "0.8", default-features = false, features = ["derive", "simd"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
hotpath = "0.31"
proptest = "1.6"
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
realfft = "3.5"
napi = { version = "3.15", default-features = false, features = ["napi10", "compat-mode"] }
napi-derive = "3.6"
napi-build = "2.6"
tauri = { version = "2", features = ["isolation"] }
tauri-build = { version = "2", features = ["isolation"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("spirv"))'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
ptr_as_ptr = "deny"
dbg_macro = "deny"
todo = "deny"
needless_range_loop = "allow"

[workspace.lints.cargo]
unused_dependencies = "warn"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.dnam-kernels]
opt-level = 3

[profile.dev.package.dnam-vm]
opt-level = 3

[profile.dev.package.dnam-engine]
opt-level = 3

[profile.dev.package.dnam-train]
opt-level = 3

[profile.dev.package.dnam-fixtures]
opt-level = 3

[profile.dev.package.dnam-capture]
opt-level = 3

[profile.test]
opt-level = 2
codegen-units = 8
debug = "line-tables-only"

[profile.test.package.dnam-kernels]
opt-level = 3

[profile.test.package.dnam-vm]
opt-level = 3

[profile.test.package.dnam-engine]
opt-level = 3

[profile.test.package.dnam-train]
opt-level = 3

[profile.test.package.dnam-fixtures]
opt-level = 3

[profile.test.package.dnam-capture]
opt-level = 3

[profile.cov]
inherits = "dev"
opt-level = 2
codegen-units = 16
debug = "line-tables-only"
strip = "none"
incremental = false

[profile.cov.package.dnam-kernels]
opt-level = 3

[profile.cov.package.dnam-vm]
opt-level = 3

[profile.cov.package.dnam-engine]
opt-level = 3

[profile.cov.package.dnam-train]
opt-level = 3

[profile.cov.package.dnam-fixtures]
opt-level = 3

[profile.cov.package.dnam-capture]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = "line-tables-only"
strip = "none"

