[package]
name = "dnam-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure Rust #![no_std] + alloc, zero-audio-alloc Layer 1 .dnam container shell, host patchbay, SPSC host, DRM/Tardos provenance, and C-ABI over dnam-vm"

[lib]
name = "dnam_engine"
crate-type = ["rlib", "cdylib", "staticlib"]
bench = false

[features]
default = ["std", "crypto"]
std = ["dnam-vm/std"]
crypto = [
    "dep:ed25519-dalek",
    "dep:x25519-dalek",
    "dep:chacha20poly1305",
    "dep:hkdf",
    "dep:sha2",
]
hotpath = ["std", "dep:hotpath", "hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-callgrind = ["hotpath", "hotpath/hotpath-callgrind"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]
hotpath-cloud = ["hotpath", "hotpath/hotpath-cloud"]

[dependencies]
dnam-kernels.workspace = true
dnam-vm = { workspace = true, features = ["alloc"] }
serde = { workspace = true, default-features = false, features = ["alloc", "derive"] }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }
zeroize = { workspace = true, default-features = false, features = ["alloc", "derive"] }
zerocopy.workspace = true
hotpath = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
hotpath = { workspace = true, features = ["criterion-0-5"] }
proptest.workspace = true

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "container_and_provenance"
harness = false

[[bench]]
name = "realtime_wcet"
harness = false

[lints]
workspace = true
