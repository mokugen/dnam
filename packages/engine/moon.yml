$schema: "https://moonrepo.dev/schemas/project.json"

id: "engine"
language: "rust"
layer: "library"
stack: "systems"
tags:
  - "rust"
  - "dsp"
  - "simd"

project:
  name: "dnam-engine"
  description: "Pure Rust #![no_std] + alloc, zero-audio-alloc real-time SIMD audio engine for DNAM"

dependsOn: ["kernels"]

tasks:
  format:
    type: "run"
    command: "cargo"
    args:
      - "fmt"
      - "--package"
      - "dnam-engine"
    options:
      cache: false
      runInCI: false
    tags:
      - "format"

  format-check:
    command: "cargo"
    args:
      - "fmt"
      - "--package"
      - "dnam-engine"
      - "--"
      - "--check"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "tests/**/*"
      - "benches/**/*"
      - "examples/**/*"
      - "/Cargo.toml"
    tags:
      - "quality"
      - "format"

  lint:
    command: "cargo"
    args:
      - "clippy"
      - "--package"
      - "dnam-engine"
      - "--all-targets"
      - "--"
      - "-D"
      - "warnings"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "tests/**/*"
      - "benches/**/*"
      - "examples/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/packages/kernels/Cargo.toml"
      - "/packages/kernels/src/**/*"
    options:
      mutex: "cargo"
    tags:
      - "quality"
      - "lint"

  typecheck:
    command: "cargo"
    args:
      - "check"
      - "--package"
      - "dnam-engine"
      - "--all-targets"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "tests/**/*"
      - "benches/**/*"
      - "examples/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/packages/kernels/Cargo.toml"
      - "/packages/kernels/src/**/*"
    options:
      mutex: "cargo"
    tags:
      - "quality"
      - "typecheck"

  build:
    type: "build"
    command: "cargo"
    args:
      - "build"
      - "--package"
      - "dnam-engine"
      - "--release"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/packages/kernels/Cargo.toml"
      - "/packages/kernels/src/**/*"
    options:
      mutex: "cargo"
    tags:
      - "build"

  test:
    command: "cargo"
    args:
      - "test"
      - "--package"
      - "dnam-engine"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "tests/**/*"
      - "examples/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/packages/kernels/Cargo.toml"
      - "/packages/kernels/src/**/*"
    options:
      mutex: "cargo"
    tags:
      - "test"

  test-x86:
    type: "run"
    command: "cargo"
    args:
      - "test"
      - "--package"
      - "dnam-engine"
      - "--target"
      - "x86_64-apple-darwin"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "tests/**/*"
      - "examples/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/packages/kernels/Cargo.toml"
      - "/packages/kernels/src/**/*"
    options:
      mutex: "cargo"
      runInCI: "skip"
    tags:
      - "test"

  test-sve2:
    type: "run"
    command: "cargo"
    args:
      - "test"
      - "--package"
      - "dnam-engine"
      - "--test"
      - "backend_parity"
      - "--test"
      - "sona_extended_pipeline"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "tests/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/packages/kernels/Cargo.toml"
      - "/packages/kernels/src/**/*"
    options:
      mutex: "cargo"
      runInCI: "skip"
    tags:
      - "test"

  coverage:
    type: "run"
    command: "pnpm"
    args:
      - "run"
      - "rust-coverage"
      - "--"
      - "--package"
      - "dnam-engine"
      - "--sources"
      - "packages/engine/src"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "tests/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/package.json"
      - "/scripts/rust-coverage.mjs"
      - "/packages/kernels/Cargo.toml"
      - "/packages/kernels/src/**/*"
    options:
      mutex: "cargo"
      runFromWorkspaceRoot: true
      runInCI: "skip"
    tags:
      - "coverage"

  bench:
    type: "run"
    command: "cargo"
    args:
      - "bench"
      - "--package"
      - "dnam-engine"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "benches/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/packages/kernels/Cargo.toml"
      - "/packages/kernels/src/**/*"
    options:
      cache: false
      mutex: "cargo"
      runInCI: false
    tags:
      - "bench"
