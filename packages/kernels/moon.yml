$schema: "https://moonrepo.dev/schemas/project.json"

id: "kernels"
language: "rust"
layer: "library"
stack: "systems"
tags:
  - "rust"
  - "dsp"
  - "simd"
  - "webgpu"

project:
  name: "dnam-kernels"
  description: "Shared #![no_std], zero-dependency 32-bit SONA DSP, associative scan, and Ozaki kernels for CPU SIMD and WebGPU"

dependsOn: []

tasks:
  format:
    type: "run"
    command: "cargo"
    args:
      - "fmt"
      - "--package"
      - "dnam-kernels"
    options:
      cache: false
      runInCI: false
    tags:
      - "format"

  format-check:
    command: "cargo"
    args:
      - "fmt"
      - "--package"
      - "dnam-kernels"
      - "--"
      - "--check"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "tests/**/*"
      - "/Cargo.toml"
    tags:
      - "quality"
      - "format"

  lint:
    command: "cargo"
    args:
      - "clippy"
      - "--package"
      - "dnam-kernels"
      - "--all-targets"
      - "--"
      - "-D"
      - "warnings"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "tests/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
    options:
      mutex: "cargo"
    tags:
      - "quality"
      - "lint"

  typecheck:
    command: "cargo"
    args:
      - "check"
      - "--package"
      - "dnam-kernels"
      - "--all-targets"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "tests/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
    options:
      mutex: "cargo"
    tags:
      - "quality"
      - "typecheck"

  build:
    type: "build"
    command: "cargo"
    args:
      - "build"
      - "--package"
      - "dnam-kernels"
      - "--release"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
    options:
      mutex: "cargo"
    tags:
      - "build"

  test:
    command: "cargo"
    args:
      - "test"
      - "--package"
      - "dnam-kernels"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "tests/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
    options:
      mutex: "cargo"
    tags:
      - "test"

  coverage:
    type: "run"
    command: "pnpm"
    args:
      - "run"
      - "rust-coverage"
      - "--"
      - "--package"
      - "dnam-kernels"
      - "--sources"
      - "packages/kernels/src"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "tests/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/package.json"
      - "/scripts/rust-coverage.mjs"
    options:
      mutex: "cargo"
      runFromWorkspaceRoot: true
      runInCI: "skip"
    tags:
      - "coverage"
